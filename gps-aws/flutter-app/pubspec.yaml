name: gps_tracker
description: Nodo embebido GPS + celular que reporta su posición a AWS.
publish_to: "none"
version: 2.0.0+3
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:       # calendario y reloj en español
    sdk: flutter
  geolocator: ^13.0.1
  http: ^1.2.2
  battery_plus: ^6.0.3
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
flutter:
  uses-material-design: true
